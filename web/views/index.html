<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOrc SPA</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; margin-top: 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>NetOrc Management Console</h1>
        <p>The SPA is successfully served from the C++ backend.</p>
        <p>Status: <span id="status">Checking...</span></p>
    </div>
    <script>
        fetch('/health')
            .then(r => r.json())
            .then(d => document.getElementById('status').innerText = 'Connected to API (' + d.status + ')')
            .catch(e => document.getElementById('status').innerText = 'API Unreachable');
    </script>
</body>
</html>
